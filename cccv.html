<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Наш календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Nunito:wght@500;700;800&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1022;
    --paper: #f8e7ea;
    --letter-paper: #fff1ee;
    --ink-dark: #9c2a4a;
    --teal: #2f6f86;
    --gold: #ffcf5c;
    --text: #f7eaf0;
    --muted: #c4adcc;
    --rose-light: #ff9fb8;
    --letter-text: #3a2230;
    --font-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-ui: "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-script: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255, 255, 255, .06) 1.2px, transparent 1.5px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 1rem;
    line-height: 1.5;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 96px; }

  /* ---------- Перфорация почтовой марки ---------- */
  .perf {
    --r: 4px;
    --g: 13px;
    -webkit-mask-image:
      radial-gradient(circle var(--r) at 50% 0, #0000 98%, #000),
      radial-gradient(circle var(--r) at 50% 100%, #0000 98%, #000),
      radial-gradient(circle var(--r) at 0 50%, #0000 98%, #000),
      radial-gradient(circle var(--r) at 100% 50%, #0000 98%, #000);
    mask-image:
      radial-gradient(circle var(--r) at 50% 0, #0000 98%, #000),
      radial-gradient(circle var(--r) at 50% 100%, #0000 98%, #000),
      radial-gradient(circle var(--r) at 0 50%, #0000 98%, #000),
      radial-gradient(circle var(--r) at 100% 50%, #0000 98%, #000);
    -webkit-mask-size: var(--g) 100%, var(--g) 100%, 100% var(--g), 100% var(--g);
    mask-size: var(--g) 100%, var(--g) 100%, 100% var(--g), 100% var(--g);
    -webkit-mask-repeat: round no-repeat, round no-repeat, no-repeat round, no-repeat round;
    mask-repeat: round no-repeat, round no-repeat, no-repeat round, no-repeat round;
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }

  .ico { width: 22px; height: 22px; fill: currentColor; flex: none; }

  /* ---------- Шапка ---------- */
  .hero { position: relative; padding: 56px 0 8px; }

  .since {
    margin: 0;
    padding-right: 104px;
    color: var(--muted);
    font-weight: 700;
    font-size: 1rem;
  }

  .count {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 .7rem;
    margin: 10px 0 14px;
    line-height: 1;
  }

  .num {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(5rem, 24vw, 8.5rem);
    letter-spacing: -.04em;
    color: var(--rose-light);
    line-height: 1;
  }

  .unit {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    color: var(--text);
  }

  .lead {
    margin: 0 0 26px;
    max-width: 34ch;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .actions { display: inline-block; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .4)); }
  .btn-wrap { display: inline-block; }
  .btn-wrap:focus-within { outline: 3px solid var(--gold); outline-offset: 5px; }

  .btn-stamp {
    --r: 4px;
    --g: 12px;
    --face: var(--paper);
    appearance: none;
    border: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--face);
    color: var(--ink-dark);
    font: 800 1.05rem/1.15 var(--font-ui);
    padding: 16px 28px 16px 22px;
    text-align: left;
  }
  .btn-stamp .ico { width: 26px; height: 26px; }
  .btn-stamp:focus { outline: none; }
  .btn-stamp:active { --face: #ecd3d9; }

  .note { margin: 0; color: var(--muted); font-size: 1rem; }
  .until { margin: 22px 0 0; color: var(--muted); font-size: .95rem; font-weight: 700; }

  /* Котик в шапке */
  .hero-cat {
    position: absolute;
    right: 0;
    top: 42px;
    width: 92px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hero-cat svg { display: block; width: 100%; height: auto; overflow: visible; }
  .hero-cat:focus { outline: none; }
  .hero-cat:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 14px; }
  .hero-cat.purr svg { animation: hop .6s ease; }

  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  .tail { transform-origin: 84px 116px; animation: wag 2.8s ease-in-out infinite; }

  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
  @keyframes wag { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
  @keyframes hop {
    30% { transform: translateY(-12px) rotate(-4deg); }
    60% { transform: translateY(0) rotate(3deg); }
    100% { transform: none; }
  }

  /* ---------- Лист марок ---------- */
  .month {
    --paper: hsl(var(--h) 90% 90%);
    --used: hsl(var(--h) 38% 78%);
    --ink: hsl(var(--h) 62% 27%);
    --night: hsl(var(--h) 24% 20%);
    --night-ink: hsl(var(--h) 38% 70%);
    margin-top: 48px;
  }

  .month h2 {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.1rem;
    line-height: 1.2;
    color: hsl(var(--h) 90% 87%);
  }
  .month h2::after { content: ""; flex: 1; border-top: 2px dashed rgba(255, 255, 255, .2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 16px 14px;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .4));
  }

  .cell {
    appearance: none;
    position: relative;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: block;
    width: 100%;
    transform: rotate(var(--rot, 0deg));
    -webkit-tap-highlight-color: transparent;
  }
  .cell:focus { outline: none; }
  .cell:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  .stamp {
    --r: 3.5px;
    --g: 11px;
    --face: var(--paper);
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    aspect-ratio: 4 / 5;
    padding: 12px 8px 10px;
    background: var(--face);
    color: var(--ink);
    transform-origin: 50% 0;
    transition: transform .12s ease, opacity .15s linear;
  }
  .cell:active .stamp { transform: scale(.97); }

  .stamp::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid currentColor;
    opacity: .38;
    pointer-events: none;
  }

  .k {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.3rem;
    letter-spacing: -.03em;
    line-height: 1;
  }

  .d { font-size: .74rem; font-weight: 800; line-height: 1; }

  /* Почтовый штемпель на прочитанных письмах */
  .pm {
    position: absolute;
    right: 9px;
    bottom: 24px;
    width: 42px;
    height: 42px;
    display: none;
    place-items: center;
    border: 1.5px solid var(--teal);
    border-radius: 50%;
    color: var(--teal);
    font: 800 .6rem/1 var(--font-ui);
    transform: rotate(-14deg);
    opacity: .9;
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  .pm::after {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid var(--teal);
    border-radius: 50%;
    opacity: .6;
  }

  .cell[data-state="opened"] .stamp { --face: var(--used); }
  .cell[data-state="opened"] .pm { display: grid; }

  .cell[data-state="locked"] .stamp { --face: var(--night); color: var(--night-ink); }

  .cell[data-today="true"] { animation: glow 2.6s ease-in-out infinite; }
  .cell[data-today="true"] .stamp { --face: #ffe39a; color: #6b3a00; }

  .cell.fresh .pm { animation: thud .5s .45s cubic-bezier(.3, 1.5, .5, 1) both; }
  .cell.shake .stamp { animation: shake .4s; }

  /* Котик, который открывает марку */
  .slot {
    --r: 3.5px;
    --g: 11px;
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    background: var(--night);
  }
  .slot::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px dashed var(--night-ink);
    opacity: .4;
  }
  .slot svg {
    position: relative;
    width: 80%;
    height: auto;
    overflow: visible;
    transform: translateY(112%);
    transition: transform .45s cubic-bezier(.3, 1.6, .5, 1) .12s;
  }

  .cell.opening .stamp {
    transform: perspective(520px) rotateX(-105deg);
    opacity: 0;
    transition: transform .5s cubic-bezier(.3, .9, .3, 1), opacity .2s linear .3s;
  }
  .cell.opening .slot svg { transform: translateY(0); }

  .fx {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 34%;
    width: 15px;
    height: 15px;
    fill: var(--rose-light);
    opacity: 0;
    pointer-events: none;
  }
  .fx1 { margin-left: -26px; }
  .fx2 { margin-left: -7px; }
  .fx3 { margin-left: 13px; }
  .cell.opening .fx1 { animation: floatUp 1s .5s ease-out both; }
  .cell.opening .fx2 { animation: floatUp 1s .65s ease-out both; }
  .cell.opening .fx3 { animation: floatUp 1s .8s ease-out both; }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(10px) scale(.5); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-48px) scale(1.15); }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 207, 92, .55)); }
    50%      { filter: drop-shadow(0 0 11px rgba(255, 207, 92, .95)); }
  }
  @keyframes thud {
    from { transform: rotate(-14deg) scale(2.3); opacity: 0; }
    to   { transform: rotate(-14deg) scale(1);   opacity: .9; }
  }
  @keyframes shake {
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  /* ---------- Письмо ---------- */
  dialog {
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--letter-text);
    max-width: none;
    max-height: none;
    overflow: visible;
  }
  dialog::backdrop {
    background: rgba(14, 7, 18, .82);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  .letter {
    position: relative;
    width: min(440px, calc(100vw - 32px));
    max-height: calc(100dvh - 104px);
    overflow: auto;
    background: var(--letter-paper);
    padding: 30px 28px 20px;
    border-radius: 3px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    transform-origin: 50% 100%;
    animation: rise .55s cubic-bezier(.2, .8, .2, 1);
  }
  .letter::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(156, 42, 74, .3);
    pointer-events: none;
  }

  .letter-cat {
    position: absolute;
    right: 34px;
    top: -58px;
    width: 76px;
    z-index: 3;
    pointer-events: none;
  }
  .letter-cat svg { display: block; width: 100%; height: auto; overflow: visible; animation: peekUp .55s .4s cubic-bezier(.3, 1.5, .5, 1) both; }

  @keyframes rise {
    from { opacity: 0; transform: perspective(900px) rotateX(60deg) translateY(36px); }
    to   { opacity: 1; transform: perspective(900px) rotateX(0) translateY(0); }
  }
  @keyframes peekUp {
    from { opacity: 0; transform: translateY(34px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes swap {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .l-body.swap { animation: swap .35s ease; }

  .l-meta { margin: 0 0 14px; color: var(--ink-dark); font-size: .98rem; font-weight: 800; }

  .l-text {
    margin: 0;
    font-family: var(--font-script);
    font-size: 1.65rem;
    line-height: 1.45;
    color: var(--letter-text);
    text-wrap: pretty;
  }

  .l-sign {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 22px 0 0;
    font-family: var(--font-script);
    font-size: 1.9rem;
    line-height: 1;
    color: var(--ink-dark);
  }
  .l-sign .ico { width: 24px; height: 24px; }

  .l-nav {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 2px dashed rgba(156, 42, 74, .35);
  }
  .l-nav .spacer { flex: 1; }

  .l-btn {
    appearance: none;
    cursor: pointer;
    font: 800 .95rem/1 var(--font-ui);
    padding: 11px 16px;
    background: none;
    color: var(--ink-dark);
    border: 1.5px solid rgba(156, 42, 74, .55);
    border-radius: 999px;
  }
  .l-btn:disabled { opacity: .35; cursor: default; }
  .l-btn.close { background: var(--ink-dark); color: #fff; border-color: var(--ink-dark); }
  .l-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Подсказка ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 24px);
    max-width: calc(100vw - 32px);
    padding: 12px 18px;
    background: var(--paper);
    color: var(--ink-dark);
    font-size: .98rem;
    font-weight: 800;
    border-radius: 999px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 10;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 720px) {
    .hero { padding-top: 80px; }
    .hero-cat { width: 124px; top: 64px; }
    .since { padding-right: 140px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 20px 18px; }
    .k { font-size: 1.45rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<main class="wrap">
  <header class="hero">
    <button class="hero-cat" id="heroCat" type="button" aria-label="Погладить котика"></button>
    <p class="since" id="since"></p>
    <p class="count"><span class="num" id="num">0</span><span class="unit" id="unit"></span></p>
    <p class="lead">Каждый день здесь открывается новое письмо. Всего их 365, по одному до нашей первой годовщины.</p>

    <p class="until" id="until"></p>
  </header>

  <div id="calendar"></div>
</main>

<dialog id="dlg" aria-labelledby="l-meta">

  <article class="letter" id="letter">
    <div class="l-body" id="lBody">
      <p class="l-meta" id="l-meta"></p>
      <p class="l-text" id="l-text"></p>
      <p class="l-sign">Я тебя люблю <svg class="ico" aria-hidden="true"><use href="#i-heart"/></svg></p>
    </div>
    <div class="l-nav">
      <button class="l-btn" id="prev" type="button">Раньше</button>
      <button class="l-btn" id="next" type="button">Позже</button>
      <span class="spacer"></span>
      <button class="l-btn close" id="close" type="button" autofocus>Закрыть</button>
    </div>
  </article>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ Данные и логика (без DOM) ============ -->
<script id="core">
// ---------- НАСТРОЙКИ ----------
var START = "2026-11-11";            // день, с которого вы вместе
var TOTAL = 365;                     // сколько писем в календаре
var TZ = "Europe/Kaliningrad";       // часовой пояс

// Особые письма по номеру дня (необязательно). Если указать, то вместо комплимента
// этого дня придёт ваш текст. Пример: 100: "Сто дней вместе!",
var SPECIAL_BY_DAY = {};

// Особые письма по календарной дате «месяц-день» (необязательно). Пример: "12-31": "С Новым годом!",
var SPECIAL_BY_DATE = {};

var MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MONTHS_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

// ---------- Даты ----------
function toUTC(s) { var p = s.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
function dayDiff(a, b) { return Math.round((toUTC(a) - toUTC(b)) / 86400000); }
function addDays(s, n) { return new Date(toUTC(s) + n * 86400000).toISOString().slice(0, 10); }
function dateOf(k) { return addDays(START, k); }

function plural(n, one, few, many) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

// ---------- Сообщения ----------
// 365 комплиментов: в день 1 приходит первый, в день 365 последний.
var MESSAGES = [
  "Ты невероятно красивая. В тебе есть что-то особенное, что невозможно описать словами. Твоя улыбка способна сделать даже самый обычный день прекрасным.",

  "Твоя улыбка — настоящее произведение искусства. Она делает тебя ещё прекраснее. Её невозможно спутать ни с чем другим.",
  "Ты обладаешь удивительной добротой. Рядом с тобой становится спокойнее. Твоё присутствие приносит тепло.",
  "У тебя потрясающий голос. В нём есть что-то невероятно приятное. Его хочется слушать снова и снова.",

  function computeToday() {
    if (testToday && /^\d{4}-\d{2}-\d{2}$/.test(testToday)) return testToday;
    return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }

  var TODAY = computeToday();
  var together = Math.max(0, dayDiff(TODAY, START));
  var maxOpen = Math.min(together, TOTAL);
  var reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  // Запоминаем, какие письма уже прочитаны (если браузер не даёт хранилище, держим в памяти)
  var KEY = "love-calendar-opened-v1" + (testToday ? "-test" : "");
  var opened = new Set();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) opened = new Set(JSON.parse(raw));
  } catch (e) {}
  function saveOpened() {
    try { localStorage.setItem(KEY, JSON.stringify(Array.from(opened))); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var cal = $("calendar"), dlg = $("dlg"), toast = $("toast");
  var fresh = new Set();
  var current = 0, busy = false, openingCell = null;

  function parts(s) { var p = s.split("-").map(Number); return { y: p[0], m: p[1], d: p[2] }; }
  function stateOf(k) { return k > together ? "locked" : (opened.has(k) ? "opened" : "new"); }

  function labelFor(k, st) {
    var p = parts(dateOf(k));
    var base = "Письмо " + k + ", " + p.d + " " + MONTHS_GEN[p.m - 1];
    if (st === "locked") return base + ". Откроется в свой день";
    if (st === "opened") return base + ". Уже прочитано";
    return base + ". Ждёт тебя";
  }

  // ---------- Котик ----------
  var OUT = "#3a2230", CREAM = "#fff1e3", PEACH = "#f4b183", PINK = "#ff9fb5", DARK = "#2a1833";

  function catHead() {
    return '<g stroke-linejoin="round" stroke-linecap="round">' +
      '<path d="M13 36 15 6 36 22Z" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<path d="M67 36 65 6 44 22Z" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<path d="M19 30 19.6 14.5 30 22Z" fill="' + PINK + '"/>' +
      '<path d="M61 30 60.4 14.5 50 22Z" fill="' + PINK + '"/>' +
      '<ellipse cx="40" cy="42" rx="30" ry="24" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<path d="M40 20v7M32 21.5l1 5.5M48 21.5l-1 5.5" fill="none" stroke="' + PEACH + '" stroke-width="3"/>' +
      '<ellipse cx="19" cy="53" rx="5" ry="3" fill="' + PINK + '" opacity=".65"/>' +
      '<ellipse cx="61" cy="53" rx="5" ry="3" fill="' + PINK + '" opacity=".65"/>' +
      '<g class="eyes">' +
        '<ellipse cx="28" cy="44" rx="4" ry="5.4" fill="' + DARK + '"/>' +
        '<ellipse cx="52" cy="44" rx="4" ry="5.4" fill="' + DARK + '"/>' +
        '<circle cx="29.5" cy="42" r="1.6" fill="#fff"/>' +
        '<circle cx="53.5" cy="42" r="1.6" fill="#fff"/>' +
      '</g>' +
      '<path d="M37.4 51.2h5.2L40 54.4Z" fill="#ff8fa8" stroke="#ff8fa8" stroke-width="1"/>' +
      '<path d="M40 54.6v1.6M40 56.2q-3.2 3.6-6.4 0M40 56.2q3.2 3.6 6.4 0" fill="none" stroke="' + DARK + '" stroke-width="1.6"/>' +
      '<path d="M6 50l13 2M6 56l13-1M74 50l-13 2M74 56l-13-1" fill="none" stroke="' + DARK + '" stroke-width="1.2" opacity=".35"/>' +
      '</g>';
  }

  function peekSVG() {
    return '<svg viewBox="0 0 80 78" aria-hidden="true" focusable="false">' + catHead() +
      '<g stroke-linejoin="round"><ellipse cx="25" cy="70" rx="9" ry="6.5" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<ellipse cx="55" cy="70" rx="9" ry="6.5" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/></g></svg>';
  }

  function sitSVG() {
    return '<svg viewBox="0 0 112 134" aria-hidden="true" focusable="false">' +
      '<g class="tail" fill="none" stroke-linecap="round">' +
        '<path d="M84 116C112 118 112 86 98 80" stroke="' + OUT + '" stroke-width="13"/>' +
        '<path d="M84 116C112 118 112 86 98 80" stroke="' + CREAM + '" stroke-width="8.5"/>' +
      '</g>' +
      '<ellipse cx="56" cy="102" rx="30" ry="29" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<path d="M40 86l7 3M72 86l-7 3M38 100l8 1M74 100l-8 1" fill="none" stroke="' + PEACH + '" stroke-width="3" stroke-linecap="round"/>' +
      '<g transform="translate(16 6)">' + catHead() + '</g>' +
      '<g stroke-linejoin="round"><ellipse cx="44" cy="127" rx="9" ry="6" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<ellipse cx="68" cy="127" rx="9" ry="6" fill="' + CREAM + '" stroke="' + OUT + '" stroke-width="2.5"/></g></svg>';
  }

  $("heroCat").innerHTML = sitSVG();
  $("letterCat").innerHTML = peekSVG();

  $("heroCat").addEventListener("click", function () {
    var c = $("heroCat");
    c.classList.remove("purr");
    void c.offsetWidth;
    c.classList.add("purr");
    showToast("Мур! Котик рад тебе");
  });

  function slotHTML() {
    var h = '<svg class="fx fx';
    return '<span class="slot perf" aria-hidden="true">' + peekSVG() + "</span>" +
      h + '1" aria-hidden="true"><use href="#i-heart"/></svg>' +
      h + '2" aria-hidden="true"><use href="#i-heart"/></svg>' +
      h + '3" aria-hidden="true"><use href="#i-heart"/></svg>';
  }

  // Котик открывает марку, затем появляется письмо
  function openWithCat(cell) {
    if (busy) return;
    var k = Number(cell.dataset.k);
    if (reduceMotion) { openLetter(k); return; }
    busy = true;
    openingCell = cell;
    cell.insertAdjacentHTML("afterbegin", slotHTML());
    void cell.offsetWidth;
    cell.classList.add("opening");
    setTimeout(function () { openLetter(k); }, 950);
  }

  function openToday() {
    var cell = cal.querySelector('.cell[data-k="' + maxOpen + '"]');
    if (!cell || reduceMotion) { openLetter(maxOpen); return; }
    var r = cell.getBoundingClientRect(), vh = window.innerHeight;
    if (r.top >= 70 && r.bottom <= vh - 70) { openWithCat(cell); return; }
    var done = false;
    function go() {
      if (done) return;
      done = true;
      window.removeEventListener("scrollend", go);
      setTimeout(function () { openWithCat(cell); }, 150);
    }
    window.addEventListener("scrollend", go);
    cell.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(go, 1300);
  }

  // ---------- Шапка ----------
  function renderHero() {
    var sp = parts(START);
    $("since").textContent = "Мы вместе с " + sp.d + " " + MONTHS_GEN[sp.m - 1] + " " + sp.y;
    $("num").textContent = together;
    $("unit").textContent = plural(together, "день", "дня", "дней") + " вместе";

    var box = $("heroAction");
    if (maxOpen < 1) {
      var fp = parts(dateOf(1));
      box.innerHTML = '<p class="note">Первое письмо откроется ' + fp.d + " " + MONTHS_GEN[fp.m - 1] + ".</p>";
    } else {
      var label = opened.has(maxOpen) ? "Прочитать сегодняшнее письмо ещё раз" : "Открыть сегодняшнее письмо";
      box.innerHTML = '<div class="actions"><span class="btn-wrap"><button class="btn-stamp perf" id="todayBtn" type="button">' +
        '<svg class="ico" aria-hidden="true"><use href="#i-cat"/></svg><span>' + label + "</span></button></span></div>";
      $("todayBtn").addEventListener("click", openToday);
    }

    var left = TOTAL - together;
    var until = $("until");
    if (left > 0) until.textContent = "До первой годовщины " + left + " " + plural(left, "день", "дня", "дней");
    else if (left === 0) until.textContent = "Сегодня наша годовщина!";
    else until.textContent = "";
  }

  // ---------- Лист марок ----------
  var HUES = [346, 24, 48, 148, 196, 252, 316, 12, 38, 170, 214, 280, 336, 20];

  function renderCalendar() {
    var html = "", lastYM = "", monthIdx = -1, open = false;
    for (var k = 1; k <= TOTAL; k++) {
      var ds = dateOf(k), p = parts(ds), ym = ds.slice(0, 7);
      if (ym !== lastYM) {
        if (open) html += "</div></section>";
        monthIdx++;
        html += '<section class="month" style="--h:' + HUES[monthIdx % HUES.length] + '">' +
                "<h2>" + MONTHS[p.m - 1] + " " + p.y + '</h2><div class="grid">';
        lastYM = ym; open = true;
      }
      var st = stateOf(k);
      var isToday = (k === maxOpen && together >= 1 && together <= TOTAL);
      var dd = (p.d < 10 ? "0" : "") + p.d, mm = (p.m < 10 ? "0" : "") + p.m;
      var rot = (((k * 37) % 7) - 3) * 0.6;
      html += '<button class="cell" type="button" data-k="' + k + '" data-state="' + st + '"' +
              (isToday ? ' data-today="true"' : "") + ' style="--rot:' + rot.toFixed(1) + 'deg" aria-label="' + labelFor(k, st) + '">' +
              '<span class="stamp perf">' +
              '<span class="k">' + k + "</span>" +
              '<svg class="ico" aria-hidden="true"><use href="#' + (st === "locked" ? "i-cat-zz" : "i-cat") + '"/></svg>' +
              '<span class="d">' + (isToday ? "сегодня" : p.d + " " + MONTHS_SHORT[p.m - 1]) + "</span>" +
              '<span class="pm" aria-hidden="true"><span>' + dd + "." + mm + "</span></span>" +
              "</span></button>";
    }
    if (open) html += "</div></section>";
    cal.innerHTML = html;
  }

  // ---------- Письмо ----------
  function fillLetter(k) {
    var p = parts(dateOf(k));
    $("l-meta").textContent = "День " + k + ", " + p.d + " " + MONTHS_GEN[p.m - 1];
    $("l-text").textContent = messageFor(k);
    $("prev").disabled = k <= 1;
    $("next").disabled = k >= maxOpen;
    var body = $("lBody");
    body.classList.remove("swap");
    void body.offsetWidth;
    body.classList.add("swap");
  }

  function openLetter(k) {
    if (k < 1 || k > maxOpen) return;
    current = k;
    if (!opened.has(k)) { opened.add(k); saveOpened(); fresh.add(k); }
    fillLetter(k);
    if (!dlg.open) dlg.showModal();
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("on");
    clearTimeout(showToast.t);
    showToast.t = setTimeout(function () { toast.classList.remove("on"); }, 2600);
  }

  cal.addEventListener("click", function (e) {
    var cell = e.target.closest(".cell");
    if (!cell || busy) return;
    var k = Number(cell.dataset.k);
    if (cell.dataset.state === "locked") {
      var p = parts(dateOf(k));
      cell.classList.remove("shake");
      void cell.offsetWidth;
      cell.classList.add("shake");
      showToast("Котик ещё спит. Это письмо откроется " + p.d + " " + MONTHS_GEN[p.m - 1]);
      return;
    }
    openWithCat(cell);
  });

  $("prev").addEventListener("click", function () { openLetter(current - 1); });
  $("next").addEventListener("click", function () { openLetter(current + 1); });
  $("close").addEventListener("click", function () { dlg.close(); });

  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") openLetter(current - 1);
    if (e.key === "ArrowRight") openLetter(current + 1);
  });

  // Письмо закрыли: котик прячется, штемпель «ставится» на марку
  dlg.addEventListener("close", function () {
    fresh.forEach(function (k) {
      var cell = cal.querySelector('.cell[data-k="' + k + '"]');
      if (!cell) return;
      cell.dataset.state = "opened";
      cell.setAttribute("aria-label", labelFor(k, "opened"));
      cell.classList.add("fresh");
      setTimeout(function () { cell.classList.remove("fresh"); }, 1500);
    });
    fresh.clear();

    if (openingCell) {
      var c = openingCell;
      openingCell = null;
      c.classList.remove("opening");
      setTimeout(function () {
        c.querySelectorAll(".slot, .fx").forEach(function (n) { n.remove(); });
        busy = false;
      }, 700);
    } else {
      busy = false;
    }
    renderHero();
  });

  // Если страница лежала открытой и наступил новый день, обновляем
  if (!testToday) {
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && computeToday() !== TODAY) location.reload();
    });
  }

  renderHero();
  renderCalendar();
})();
</script>
</body>
</html>
